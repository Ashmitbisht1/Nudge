name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Put the app files in the www folder
        run: mkdir -p www && cp index.html native.js www/
      - name: Prepare your signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing. Add it under Settings > Secrets and variables > Actions, otherwise new versions cannot install over the old app."
            exit 1
          fi
          echo "$KS" | base64 -d > "$PWD/nudge.keystore"
          keytool -list -keystore "$PWD/nudge.keystore" -storepass android -alias androiddebugkey > /dev/null || { echo "::error::The KEYSTORE_BASE64 secret is not a valid signing key. Paste the whole line from signing-key-secret.txt."; exit 1; }
          mkdir -p ~/.android && cp "$PWD/nudge.keystore" ~/.android/debug.keystore
          echo "NUDGE_KS=$PWD/nudge.keystore" >> $GITHUB_ENV
          echo "NUDGE_VC=$(( $(date +%s) / 60 ))" >> $GITHUB_ENV
          echo "NUDGE_VN=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nudge-signing.gradle <<'GRADLE'
          allprojects { proj ->
            proj.afterEvaluate {
              if (proj.plugins.hasPlugin('com.android.application')) {
                def ks = System.getenv('NUDGE_KS')
                if (ks) {
                  def sc = proj.android.signingConfigs.create('nudge')
                  sc.storeFile = new File(ks)
                  sc.storePassword = 'android'
                  sc.keyAlias = 'androiddebugkey'
                  sc.keyPassword = 'android'
                  proj.android.buildTypes.getByName('debug').signingConfig = sc
                }
                def vc = System.getenv('NUDGE_VC')
                if (vc) proj.android.defaultConfig.versionCode = vc.toInteger()
                def vn = System.getenv('NUDGE_VN')
                if (vn) proj.android.defaultConfig.versionName = vn
              }
            }
          }
          GRADLE
      - run: npm install
      - run: npx cap add android
      - name: App icon and full-screen layout
        run: |
          unzip -o icons.zip -d android/app/src/main/res
          M=android/app/src/main/java/com/nudge/reminders/MainActivity.java
          if [ -f "$M" ]; then
            cp "$M" "$M.orig"
            cp MainActivity.java "$M"
            echo "mainact=$PWD/$M" >> $GITHUB_ENV
          else
            echo "::warning::MainActivity not found, full-screen layout skipped"
          fi
      - name: Declare permissions and lock-screen display
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS USE_EXACT_ALARM SCHEDULE_EXACT_ALARM VIBRATE USE_FULL_SCREEN_INTENT; do
            grep -q "$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done
          grep -q showWhenLocked $M || sed -i 's#<activity#<activity android:showWhenLocked="true" android:turnScreenOn="true"#' $M
      - name: Let Zen-mode reminders open over the lock screen
        run: |
          python3 - <<'PY'
          import glob, os, shutil
          fs = glob.glob('node_modules/@capacitor/local-notifications/android/**/LocalNotificationManager.java', recursive=True)
          if not fs:
              print('::warning::Lock-screen patch not applied (file not found)')
              raise SystemExit
          f = os.path.abspath(fs[0])
          s = open(f).read()
          a = 'mBuilder.setContentIntent(pendingIntent);'
          if a not in s:
              print('::warning::Lock-screen patch not applied (plugin code is different)')
              raise SystemExit
          shutil.copy(f, f + '.orig')
          add = ' if (localNotification.getSource() != null && localNotification.getSource().replace(" ", "").contains("\\"zen\\":true")) { mBuilder.setFullScreenIntent(pendingIntent, true); }'
          open(f, 'w').write(s.replace(a, a + add, 1))
          open(os.environ['GITHUB_ENV'], 'a').write('patched=' + f + '\n')
          print('Lock-screen patch applied to', f)
          PY
      - run: npx cap sync android
      - name: Build
        run: |
          cd android
          ./gradlew assembleDebug || {
            echo "::warning::Build with the optional patches failed, retrying without them"
            if [ -n "$patched" ]; then cp "$patched.orig" "$patched"; fi
            if [ -n "$mainact" ]; then cp "$mainact.orig" "$mainact"; fi
            ./gradlew assembleDebug || {
              echo "::warning::Build with the custom signing setup failed, retrying with the default one"
              rm -f ~/.gradle/init.d/nudge-signing.gradle
              ./gradlew assembleDebug
            }
          }
      - name: Show the signing fingerprint
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs "$APK" | grep -i "SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Nudge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
