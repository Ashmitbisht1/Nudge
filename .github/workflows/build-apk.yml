name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Put the app files in the www folder
        run: mkdir -p www && cp index.html native.js www/
      - name: Use your signing key (kept as a private secret)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::No KEYSTORE_BASE64 secret found, using a temporary key"
          fi
      - run: npm install
      - run: npx cap add android
      - name: Declare permissions and lock-screen display
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS USE_EXACT_ALARM SCHEDULE_EXACT_ALARM VIBRATE USE_FULL_SCREEN_INTENT; do
            grep -q "$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done
          grep -q showWhenLocked $M || sed -i 's#<activity#<activity android:showWhenLocked="true" android:turnScreenOn="true"#' $M
      - name: Let Zen-mode reminders open over the lock screen
        run: |
          python3 - <<'PY'
          import glob, os, shutil
          fs = glob.glob('node_modules/@capacitor/local-notifications/android/**/LocalNotificationManager.java', recursive=True)
          if not fs:
              print('::warning::Lock-screen patch not applied (file not found)')
              raise SystemExit
          f = os.path.abspath(fs[0])
          s = open(f).read()
          a = 'mBuilder.setContentIntent(pendingIntent);'
          if a not in s:
              print('::warning::Lock-screen patch not applied (plugin code is different)')
              raise SystemExit
          shutil.copy(f, f + '.orig')
          add = ' if (localNotification.getSource() != null && localNotification.getSource().replace(" ", "").contains("\\"zen\\":true")) { mBuilder.setFullScreenIntent(pendingIntent, true); }'
          open(f, 'w').write(s.replace(a, a + add, 1))
          open(os.environ['GITHUB_ENV'], 'a').write('patched=' + f + '\n')
          print('Lock-screen patch applied to', f)
          PY
      - run: npx cap sync android
      - name: Build
        run: |
          cd android
          ./gradlew assembleDebug || {
            echo "::warning::Build with the lock-screen patch failed, retrying without it"
            if [ -n "$patched" ]; then cp "$patched.orig" "$patched"; fi
            ./gradlew assembleDebug
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Nudge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
