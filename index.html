<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nudge</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f0;--card:#fff;--ink:#2b2a33;--mute:#7b7885;--acc:#6c63d9;--acc2:#efecff;--line:#ece6dc;--onacc:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161d;--card:#211f2a;--ink:#f1eff7;--mute:#9a97a8;--acc:#9d96ff;--acc2:#2c2945;--line:#302d3c;--onacc:#17161d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17161d;--card:#211f2a;--ink:#f1eff7;--mute:#9a97a8;--acc:#9d96ff;--acc2:#2c2945;--line:#302d3c;--onacc:#17161d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'DM Sans',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 90px}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top h1{font-size:26px}.top p{margin:2px 0 0;color:var(--mute)}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc2);border:0;font-size:22px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.awake{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--acc2);border-color:transparent}
.awake b{display:block}.awake small{color:var(--mute)}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:12px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:transparent;color:#d1495b;border:1px solid var(--line)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.sec h2{font-size:19px}
.task{display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s}
.task:hover{transform:translateY(-1px)}.task.off{opacity:.55}
.ic{width:46px;height:46px;border-radius:14px;background:var(--acc2);display:grid;place-items:center;font-size:24px;flex:none}
.tx{flex:1;min-width:0}.tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{color:var(--mute);display:block}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--acc)}.sw.on::after{left:21px}
.empty{text-align:center;color:var(--mute);padding:26px}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--onacc);border:0;border-radius:99px;padding:14px 22px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheetbg.show{display:flex}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
#sheet h2{margin-bottom:14px}
label{display:block;font-weight:600;font-size:13px;color:var(--mute);margin:14px 0 6px}
input[type=text],input[type=time],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);padding:8px;border-radius:9px;font-weight:600}
.seg button.on{background:var(--acc);color:var(--onacc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--acc2);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.em{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px}
.em.on{border-color:var(--acc);background:var(--acc2)}.em:disabled{opacity:.25;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--mute);margin:6px 0 0}
.tg{position:fixed;left:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:32px;height:32px;border-radius:50%;background:var(--card);border:2px solid var(--mute);display:grid;place-items:center;padding:0;z-index:10;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.tg::before{content:"";position:absolute;inset:-10px}
.tg span{width:16px;height:16px;border-radius:50%;background:var(--ink);transition:background .2s}
.sqs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sq{position:relative;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);padding:0;overflow:hidden}
.sq i{position:absolute;left:8px;right:8px;bottom:8px;height:32%;border-radius:6px}
.sq u{position:absolute;left:12px;bottom:15px;width:9px;height:9px;border-radius:50%}
.sq b{position:absolute;top:6px;left:9px;font-size:13px}
.sq.on{outline:3px solid var(--acc);outline-offset:2px}
.pfb{background:var(--acc2);color:var(--ink);border:1.5px solid var(--acc);padding:11px 18px;border-radius:14px;font-size:15px;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set input{flex:1;min-width:0}
.toast .hd .dn{margin-left:auto;padding:6px 12px;font-size:13px}.toast .dn+.x{margin-left:4px}
#zen{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.zc{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;width:100%;max-width:420px}
.zb{font-size:72px;line-height:1}.zc h2{font-size:26px}
.zd{width:170px;height:170px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:64px;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.zd.s{width:52px;height:52px;font-size:24px;box-shadow:none;margin-left:auto;flex:none}
.zr{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}.zb2{font-size:30px}
.zl{background:transparent;border:0;color:var(--mute);margin-top:10px}
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.hgrid small{text-align:center;color:var(--mute)}
.hm{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:12px;padding:0}
.hm.today{outline:2px solid var(--acc);outline-offset:1px}.hm.fut{opacity:.35}
.hnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.acts{display:flex;gap:10px;margin-top:20px}.acts .btn{flex:1}
.row2{display:flex;gap:8px}.row2 input{flex:1}.em.pick{width:52px;height:auto;flex:none}
.dd{margin-top:8px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set small{display:block;color:var(--mute)}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(-14px)}}
.toast .hd{display:flex;align-items:center;gap:12px;cursor:pointer}
.toast .big{font-size:30px}.toast .x{border:0;background:transparent;color:var(--mute);font-size:20px;margin-left:auto}
.toast.eo{width:auto;padding:10px 16px}.toast.eo .big{font-size:38px}
.toast .list{margin-top:8px;border-top:1px solid var(--line)}
.toast .li{display:flex;gap:10px;align-items:center;padding:8px 2px;cursor:pointer}
.toast .li span:first-child{font-size:20px}
.eos{display:flex;gap:6px}.eos button{border:0;background:transparent;font-size:34px;padding:0 2px}
</style></head><body>
<div class="wrap" id="app"></div>
<div id="toasts"></div><button class="tg" id="tg" aria-label="Light or dark mode. Long press for themes"><span></span></button>
<div id="sheetbg"><div id="sheet"></div></div>
<script>
const EMOJIS='💧 🥤 🍎 🥗 🧘 🚶 🏃 💊 😴 📖 🧠 👀 🌿 ☕ 🍵 🪥 🧴 ☀️ 🌙 🧹 🦷 💪 🙏 ✍️ 📞 🐕 🌱 🍊 🥜 🎧 🧊 🛌 🪴 🧼 🫖 🌸'.split(' ');
const AVS='🌿 🦊 🐼 🌻 🦉 🐢 🌙 ⭐'.split(' ');
const KEY='nudge-v1';
let S={profile:{name:'',emoji:'🌿'},emojiOnly:false,awake:null,tasks:[
 {id:'a1',title:'Drink water',mode:'window',start:'05:00',end:'23:00',iv:30,emoji:'💧',on:true},
 {id:'a2',title:'Stretch your legs',mode:'wake',start:'05:00',end:'23:00',iv:60,emoji:'🧘',on:true}]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.profiles){S.profiles=[{id:'p1',name:'Default',tasks:S.tasks}];S.pid='p1'}
delete S.tasks;
const prof=id=>S.profiles.find(p=>p.id===id)||S.profiles[0];
const own=id=>S.profiles.find(p=>p.tasks.some(t=>t.id===id));
const ess=()=>S.pid===S.profiles[0].id?[]:S.profiles[0].tasks.filter(t=>t.ess);
const live=()=>S.tasks.concat(ess());
Object.defineProperty(S,'tasks',{get(){return prof(S.pid).tasks},set(v){prof(S.pid).tasks=v},enumerable:false,configurable:true});
const LK='nudge-log';let LOG={first:Date.now(),done:{},days:{},sw:[],sessions:[]};
try{const r=localStorage.getItem(LK);if(r)LOG=Object.assign(LOG,JSON.parse(r))}catch(e){}
if(!LOG.sw.length)LOG.sw.push({t:0,pid:S.pid});
if(S.awake&&!LOG.sessions.length)LOG.sessions.push({a:S.awake});
const saveLog=()=>{try{localStorage.setItem(LK,JSON.stringify(LOG))}catch(e){}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}try{window.onSave&&window.onSave()}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const f12=s=>{let[a,b]=s.split(':').map(Number);const p=a>=12?'PM':'AM';a=a%12||12;return a+':'+String(b).padStart(2,'0')+' '+p};
const dayStart=o=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()+o).getTime()};
const ivTxt=m=>m%60===0?(m===60?'hour':m/60+' hours'):m+' min';
/* ---------- scheduling ---------- */
function winLen(t){let l=hm(t.end)-hm(t.start);if(l<=0)l+=1440;return l*60000}
function slot(t,now){const iv=t.iv*60000;
 if(t.mode==='wake'){if(!S.awake)return null;const k=Math.floor((now-S.awake)/iv);return k>=1?S.awake+k*iv:null}
 for(const o of[0,-1]){const b=dayStart(o)+hm(t.start)*60000;
  if(now>=b&&now<=b+winLen(t))return b+Math.floor((now-b)/iv)*iv}
 return null}
function nextT(t,now){const iv=t.iv*60000;
 if(t.mode==='wake'){return S.awake?S.awake+(Math.floor((now-S.awake)/iv)+1)*iv:null}
 for(let o=-1;o<=1;o++){const b=dayStart(o)+hm(t.start)*60000;
  const k=Math.max(0,Math.floor((now-b)/iv)+(now>=b?1:0)),c=b+k*iv;
  if(c>now&&c<=b+winLen(t))return c}
 return null}
const last={};
function tick(){const now=Date.now(),due=[];
 live().forEach(t=>{if(!t.on){delete last[t.id];return}
  const s=slot(t,now);
  if(last[t.id]===undefined){last[t.id]=s;return}
  if(s!==null&&s!==last[t.id])due.push(t);
  last[t.id]=s});
 if(due.length){if(S.zen&&!document.hidden)zen(due);else if(!window.NATIVE)dispatch(due)}
 document.querySelectorAll('[data-next]').forEach(el=>{const t=live().find(x=>x.id===el.dataset.next);el.textContent=nextLabel(t)})}
function nextLabel(t){if(!t||!t.on)return 'Paused';
 if(t.mode==='wake'&&!S.awake)return 'Starts when you wake';
 const n=nextT(t,Date.now());if(!n)return '—';
 const m=Math.max(1,Math.round((n-Date.now())/60000));
 if(m<60)return 'Next in '+m+' min';
 return 'Next at '+new Date(n).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function dispatch(due){
 if(due.length===1)return show(due);
 if(due.length<=3)return due.forEach((t,i)=>setTimeout(()=>show([t]),i*4000));
 show(due)}
/* ---------- notifications ---------- */
function sysNotify(list){try{if(window.Notification&&Notification.permission==='granted'){
 const eo=S.emojiOnly,e=t=>t.emoji||'🔔';
 const title=eo?list.map(e).join(' '):(list.length>1?list.length+' reminders':(list[0].emoji?list[0].emoji+' ':'')+list[0].title);
 const body=eo?'':list.length>1?list.map(t=>(t.emoji||'•')+' '+t.title).join('\n'):'Time for a quick check-in';
 const n=new Notification(title,{body});n.onclick=()=>{window.focus();openTask(list[0].id)}}}catch(e){}}
function show(list){
 sysNotify(list);
 const el=document.createElement('div'),eo=S.emojiOnly,e=t=>t.emoji||'🔔';
 const kill=()=>el.remove();
 el.className='toast'+(eo?' eo':'');
 if(eo){
  el.innerHTML='<div class="eos">'+list.map(t=>`<button data-id="${t.id}">${e(t)}</button>`).join('')+'<button class="dn2" style="font-size:24px">✓</button></div>';
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{kill();openTask(b.dataset.id)});
  el.querySelector('.dn2').onclick=ev=>{ev.stopPropagation();markDone(list);kill()};setTimeout(kill,9000)}
 else if(list.length===1){const t=list[0];
  el.innerHTML=`<div class="hd"><span class="big">${t.emoji||'🔔'}</span><div class="tx"><b>${esc(t.title)}</b><small>Time for a quick check-in</small></div><button class="btn dn">✓ Done</button><button class="x">×</button></div>`;
  el.querySelector('.hd').onclick=()=>{kill();openTask(t.id)};
  el.querySelector('.x').onclick=ev=>{ev.stopPropagation();kill()};
  el.querySelector('.dn').onclick=ev=>{ev.stopPropagation();markDone(list);kill()};setTimeout(kill,10000)}
 else{
  el.innerHTML=`<div class="hd"><span class="big">🔔</span><div class="tx"><b>${list.length} reminders right now</b><small>${list.map(t=>t.emoji||'•').join(' ')} · tap to open</small></div><button class="x">×</button></div><div class="list" hidden>${list.map(t=>`<div class="li" data-id="${t.id}"><span>${t.emoji||'•'}</span><span>${esc(t.title)}</span></div>`).join('')}</div>`;
  const ls=el.querySelector('.list');ls.insertAdjacentHTML('beforeend','<button class="btn dn" id="da" style="margin:8px 0 2px;width:100%">Mark all done</button>');el.querySelector('#da').onclick=()=>{markDone(list);kill()};
  el.querySelector('.hd').onclick=()=>{ls.hidden=!ls.hidden};
  el.querySelector('.x').onclick=ev=>{ev.stopPropagation();kill()};
  el.querySelectorAll('.li').forEach(r=>r.onclick=()=>{kill();openTask(r.dataset.id)});
  setTimeout(kill,25000)}
 $('#toasts').appendChild(el)}
/* ---------- views ---------- */
function render(){
 const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 const nm=S.profile.name?', '+esc(S.profile.name):'';
 $('#app').innerHTML=`
 <div class="top"><div><h1>${g}${nm}</h1><p>Gentle nudges, only when you want them.</p></div><button class="av" id="prof">${S.profile.emoji}</button></div>
 <div class="card awake"><div><b>${S.awake?'You’re awake ☀️':'Sleeping 🌙'}</b><small>${S.awake?'Since '+new Date(S.awake).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Wake-based reminders are paused'}</small></div><button class="btn" id="wk">${S.awake?'Go to sleep':'I’m awake'}</button></div>
 <div class="sec"><h2>Your reminders</h2><button class="btn pfb" id="pf">📂 ${esc(prof(S.pid).name)} ▾</button></div>
 ${S.tasks.length?S.tasks.map(t=>`<div class="card task ${t.on?'':'off'}" data-id="${t.id}"><div class="ic">${t.emoji||'🔔'}</div><div class="tx"><b>${t.ess?'⭐ ':''}${esc(t.title)}</b><small>Every ${ivTxt(t.iv)} · ${t.mode==='wake'?'while awake':f12(t.start)+'–'+f12(t.end)}</small><small data-next="${t.id}">${nextLabel(t)}</small></div><button class="sw ${t.on?'on':''}" data-sw="${t.id}" aria-label="Toggle"></button></div>`).join(''):'<div class="empty">No reminders yet. Tap “New reminder” to add one.</div>'}
 ${ess().length?`<div class="sec"><h2>⭐ Essential</h2><span class="hint">From ${esc(S.profiles[0].name)}</span></div>${ess().map(card).join('')}`:''}
 ${S.heat?heatHTML():''}
 <button class="fab" id="add">＋ New reminder</button>`;
 $('#prof').onclick=openSettings;$('#pf').onclick=openProfiles;if(S.heat)bindHeat();
 $('#add').onclick=()=>openEditor();
 $('#wk').onclick=()=>{const n=Date.now();if(S.awake){const s=LOG.sessions[LOG.sessions.length-1];if(s&&!s.s)s.s=n;S.awake=null}else{LOG.sessions.push({a:n});S.awake=n}saveLog();live().forEach(t=>{if(t.mode==='wake')delete last[t.id]});save();render()};
 document.querySelectorAll('.task').forEach(c=>c.onclick=()=>openEditor(c.dataset.id));
 document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const t=live().find(x=>x.id===b.dataset.sw);t.on=!t.on;save();render()})}
function sheet(html){$('#sheet').innerHTML=html;$('#sheetbg').classList.add('show')}
function closeSheet(){$('#sheetbg').classList.remove('show')}
$('#sheetbg').onclick=e=>{if(e.target.id==='sheetbg')closeSheet()};
function openTask(id){if(S.tasks.some(t=>t.id===id))openEditor(id)}
function openEditor(id){
 const ex=live().find(t=>t.id===id);
 const d=ex?{...ex}:{title:'',mode:'window',start:'08:00',end:'22:00',iv:30,emoji:'',on:true};
 const used=live().filter(t=>t.id!==id&&t.emoji).map(t=>t.emoji);let open=false;const canEss=ex?own(id)===S.profiles[0]:S.pid===S.profiles[0].id;
 const draw=()=>{sheet(`<h2>${ex?'Edit reminder':'New reminder'}</h2>
 <label>Reminder</label><div class="row2"><button class="em pick" id="ep" type="button">${d.emoji||'😎'}</button><input type="text" id="ti" maxlength="40" placeholder="e.g. Drink water" value="${esc(d.title)}"></div>${open?`<div class="grid dd"><button class="em" data-e="">✕</button>${EMOJIS.map(e=>`<button class="em ${d.emoji===e?'on':''}" data-e="${e}" ${used.includes(e)?'disabled':''}>${e}</button>`).join('')}</div>`:''}
 <label>When</label><div class="seg"><button data-m="window" class="${d.mode==='window'?'on':''}">Time window</button><button data-m="wake" class="${d.mode==='wake'?'on':''}">When I’m awake</button></div>
 ${d.mode==='window'?`<div class="row" style="margin-top:10px"><div><label style="margin-top:0">From</label><input type="time" id="st" value="${d.start}"></div><div><label style="margin-top:0">Until</label><input type="time" id="en" value="${d.end}"></div></div>`:''}
 <label>Repeat every (minutes)</label><input type="number" id="iv" min="1" max="1440" value="${d.iv}">
 <div class="chips">${[15,30,60,90].map(m=>`<button class="chip ${d.iv===m?'on':''}" data-iv="${m}">${m} min</button>`).join('')}</div>

 ${canEss?`<div class="set"><div><b>⭐ Essential</b><small>Also reminds you in your other profiles</small></div><button class="sw ${d.ess?'on':''}" id="es"></button></div>`:''}
 <div class="acts">${ex?'<button class="btn del" id="rm">Delete</button><button class="btn ghost" id="ts">Test</button>':''}<button class="btn" id="sv">Save</button></div>`);
  const grab=()=>{d.title=$('#ti').value;d.iv=Math.max(1,Math.min(1440,+$('#iv').value||30));if(d.mode==='window'){d.start=$('#st').value||d.start;d.end=$('#en').value||d.end}};
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{grab();d.mode=b.dataset.m;draw()});

  $('#sv').onclick=()=>{grab();if(!d.title.trim()){$('#ti').focus();return}

   if(ex)Object.assign(ex,d);else S.tasks.push({...d,id:'t'+Date.now(),c:Date.now()});

  if(ex){$('#rm').onclick=()=>{const o=own(id);o.tasks=o.tasks.filter(t=>t.id!==id);save();closeSheet();render()};

/* ---------- log, profiles, zen, heatmap ---------- */
const mid=ms=>{const d=new Date(ms);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const nday=(ms,n=1)=>{const d=new Date(ms);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n).getTime()};
const dkey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const occOf=t=>slot(t,Date.now())||Date.now();
function markDone(ts,x){ts.forEach(t=>{LOG.done[t.id+'@'+Math.round((x||occOf(t))/6e4)]=Date.now()});saveLog();flash('Marked done ✓');render()}
function flash(m){const el=document.createElement('div');el.className='toast';el.innerHTML=`<div class="hd"><span class="big">✓</span><div class="tx"><b>${m}</b></div></div>`;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),2200)}
function buzz(n){const H=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Haptics;
 const go=()=>{try{H?H.vibrate({duration:120}):navigator.vibrate&&navigator.vibrate(120)}catch(e){}};go();if(n>1)setTimeout(go,260)}
function activeAt(x){let p=LOG.sw[0].pid;LOG.sw.forEach(s=>{if(s.t<=x)p=s.pid});return p}
function occs(t,from,to){const iv=t.iv*6e4,lo=Math.max(from,t.c||LOG.first),o=[];
 if(t.mode==='wake')LOG.sessions.forEach(s=>{const end=Math.min(s.s||Date.now(),s.a+16*36e5);for(let x=s.a+iv;x<=end;x+=iv)if(x>=lo&&x<to)o.push(x)});
 else for(let d=nday(mid(from),-1);d<to;d=nday(d)){const b=d+hm(t.start)*6e4,e=b+winLen(t);for(let x=b;x<=e;x+=iv)if(x>=lo&&x<to)o.push(x)}
 return[...new Set(o)].sort((a,b)=>a-b)}
/* a reminder is missed when its next one is due and Done was never pressed */
function calc(ms){const to=nday(ms),now=Date.now(),r={};
 S.profiles.forEach(p=>p.tasks.forEach(t=>{if(!t.on)return;
  const xs=occs(t,ms,to).filter(x=>x<=now&&(activeAt(x)===p.id||(t.ess&&p.id===S.profiles[0].id)));
  if(xs.length)r[t.id]={n:t.title,e:t.emoji,p:p.id,s:t.ess?1:0,i:xs.map(x=>[x,LOG.done[t.id+'@'+Math.round(x/6e4)]?1:now>=x+t.iv*6e4?2:0])}}));
 return r}
function settle(){const now=Date.now();let d=LOG.settled?nday(LOG.settled):mid(LOG.first),n=0;
 while(nday(d)+36e5<=now&&n++<400){const r=calc(d);Object.values(r).forEach(v=>v.i.forEach(z=>{if(!z[1])z[1]=2}));LOG.days[dkey(d)]=r;LOG.settled=d;d=nday(d)}
 saveLog()}
const rows=ms=>Object.values(LOG.days[dkey(ms)]||calc(ms)).filter(v=>v.p===S.pid||v.s);
function tally(ms){let d=0,m=0;rows(ms).forEach(v=>v.i.forEach(z=>{if(z[1]===1)d++;else if(z[1]===2)m++}));return[d,m]}
const heat=(d,m)=>{const n=d+m;if(!n)return'';const p=d/n,a=(.25+.75*Math.abs(p-.5)*2).toFixed(2);return p>=.5?`rgba(46,160,100,${a})`:`rgba(220,70,80,${a})`};
const HV={m:'week',o:0};
function hdays(){const n=Date.now();
 if(HV.m==='week'){const t=nday(mid(n),-((new Date(n).getDay()+6)%7)+HV.o*7);return{list:[...Array(7)].map((_,i)=>nday(t,i)),pad:0}}
 const d=new Date(n),f=new Date(d.getFullYear(),d.getMonth()+HV.o,1),c=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
 return{list:[...Array(c)].map((_,i)=>nday(f.getTime(),i)),pad:(f.getDay()+6)%7,title:f.toLocaleDateString([],{month:'long',year:'numeric'})}}
function heatHTML(){const D=hdays(),n=Date.now(),W=['M','T','W','T','F','S','S'];
 const f=ms=>new Date(ms).toLocaleDateString([],{day:'numeric',month:'short'});
 const lbl=D.title||f(D.list[0])+' – '+f(D.list[6]);
 return `<div class="sec"><h2>Progress</h2><div class="seg" style="width:150px"><button data-hv="week" class="${HV.m==='week'?'on':''}">Week</button><button data-hv="month" class="${HV.m==='month'?'on':''}">Month</button></div></div><div class="card"><div class="hnav"><button class="chip" id="hp">‹</button><b>${lbl}</b><button class="chip" id="hn">›</button></div><div class="hgrid">${W.map(x=>`<small>${x}</small>`).join('')}${'<i></i>'.repeat(D.pad)}${D.list.map(ms=>{const fut=ms>n,[d,m]=fut?[0,0]:tally(ms),c=heat(d,m);return `<button class="hm ${mid(n)===ms?'today':''} ${fut?'fut':''}" data-d="${ms}" ${fut?'disabled':''} style="${c?'background:'+c:''}">${new Date(ms).getDate()}</button>`}).join('')}</div><p class="hint">Green done · Red missed · Blank no reminders. Darker means more.</p></div>`}
function bindHeat(){document.querySelectorAll('[data-hv]').forEach(b=>b.onclick=()=>{HV.m=b.dataset.hv;HV.o=0;render()});
 $('#hp').onclick=()=>{HV.o--;render()};$('#hn').onclick=()=>{if(HV.o<0){HV.o++;render()}};
 document.querySelectorAll('.hm').forEach(b=>b.onclick=()=>openDay(+b.dataset.d))}
function openDay(ms){const r=rows(ms),[d,m]=tally(ms),n=d+m;
 sheet(`<h2>${new Date(ms).toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}</h2>${n?`<p class="hint"><b>${d}</b> done · <b>${m}</b> missed · ${Math.round(d/n*100)}%</p>`:'<p class="hint">No reminders were active.</p>'}${r.map(v=>`<div class="card"><b>${v.e||'🔔'} ${esc(v.n)}</b> <small style="color:var(--mute)">${v.i.filter(z=>z[1]===1).length}/${v.i.length}</small><div class="chips">${v.i.map(z=>`<span class="chip" style="${z[1]===1?'background:rgba(46,160,100,.25)':z[1]===2?'background:rgba(220,70,80,.25)':''}">${new Date(z[0]).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} ${z[1]===1?'✓':z[1]===2?'✕':'…'}</span>`).join('')}</div></div>`).join('')}<div class="acts"><button class="btn" id="dd">Close</button></div>`);$('#dd').onclick=closeSheet}

 $('#ap').onclick=()=>{const n=$('#np').value.trim();if(!n)return;const p={id:'p'+Date.now(),name:n,tasks:[]};S.profiles.push(p);setProfile(p.id);openProfiles()};

let ZL=[];
function zen(list,x){list.forEach(t=>{const o=ZL.find(z=>z.t.id===t.id);if(o)o.x=x||occOf(t);else ZL.push({t,x:x||occOf(t)})});drawZen();buzz(2)}
function drawZen(){let z=$('#zen');if(!ZL.length){if(z)z.remove();render();return}
 if(!z){z=document.createElement('div');z.id='zen';document.body.appendChild(z)}
 const one=ZL.length===1,eo=S.emojiOnly;
 z.innerHTML=one?`<div class="zc"><div class="zb">${ZL[0].t.emoji||'🔔'}</div>${eo?'':`<h2>${esc(ZL[0].t.title)}</h2>`}<button class="zd" data-z="0">✓</button><button class="zl">Later</button></div>`:`<div class="zc">${ZL.map((o,i)=>`<div class="zr"><span class="zb2">${o.t.emoji||'🔔'}</span>${eo?'':`<b>${esc(o.t.title)}</b>`}<button class="zd s" data-z="${i}">✓</button></div>`).join('')}<button class="btn" id="zall">All done</button><button class="zl">Later</button></div>`;
 z.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const o=ZL.splice(+b.dataset.z,1)[0];markDone([o.t],o.x);buzz(1);drawZen()});
 const all=z.querySelector('#zall');if(all)all.onclick=()=>{const l=ZL;ZL=[];l.forEach(o=>markDone([o.t],o.x));buzz(1);drawZen()};
 z.querySelector('.zl').onclick=()=>{ZL=[];drawZen()}}
